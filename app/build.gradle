android {
    compileSdk 35
    namespace 'com.nobody.ultraai'

    aaptOptions {
        ignoreAssetsPattern '!*.hprof:!*.p2p:!*.pyc:!*.pyo:!*.rb:!*.yarb:!*~'
    }

    defaultConfig {
        applicationId "com.nobody.ultraai"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
        }
    }

    dependencies {
        implementation 'androidx.appcompat:appcompat:1.6.1'
        implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    }
}
